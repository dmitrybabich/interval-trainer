<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#2a231d"/>
      <stop offset="100%" stop-color="#171310"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background so the icon is "maskable" (safe zone is the center 80%). -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Pitch wave: a sine sweep landing on the target line, echoing the meter. -->
  <path d="M 96 300 C 150 210, 190 210, 224 256 C 250 292, 274 292, 300 256 C 326 220, 352 220, 384 256"
        fill="none" stroke="#d1683f" stroke-width="20" stroke-linecap="round"/>
  <!-- Target line + on-pitch dot (sage). -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="#5a9a6b" stroke-width="8" stroke-dasharray="4 20" stroke-linecap="round" opacity="0.9"/>
  <circle cx="384" cy="256" r="26" fill="#5a9a6b"/>
  <!-- Music note (warm bone). -->
  <g fill="#efe6d8">
    <rect x="236" y="120" width="16" height="150" rx="6"/>
    <path d="M 236 120 C 236 120, 300 128, 300 168 C 300 176, 288 178, 252 172 L 252 140 Z"/>
    <ellipse cx="222" cy="272" rx="30" ry="22" transform="rotate(-18 222 272)"/>
  </g>
</svg>
