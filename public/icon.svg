<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#34291f"/>
      <stop offset="60%" stop-color="#1e1712"/>
      <stop offset="100%" stop-color="#130f0c"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#b4562f"/>
      <stop offset="100%" stop-color="#ec8450"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6fb884" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6fb884" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Full-bleed ground so the icon is maskable (safe zone = centre 80%). -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Target line the voice aims for, centred vertically. -->
  <line x1="86" y1="256" x2="426" y2="256" stroke="#5a9a6b" stroke-width="10"
        stroke-dasharray="2 26" stroke-linecap="round" opacity="0.85"/>

  <!-- The pitch journey: a searching wobble that rises and locks onto the target
       — the whole app in one gesture. Baseline kept near centre so the mark sits
       balanced; under-glow for depth. -->
  <path d="M 96 300 C 146 300, 162 262, 194 274 C 226 286, 238 274, 264 274 C 322 274, 306 168, 356 256"
        fill="none" stroke="url(#wave)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#soft)" opacity="0.4"/>
  <path d="M 96 300 C 146 300, 162 262, 194 274 C 226 286, 238 274, 264 274 C 322 274, 306 168, 356 256"
        fill="none" stroke="url(#wave)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- On-pitch landing: sage glow + solid dot + bright core. -->
  <circle cx="356" cy="256" r="86" fill="url(#glow)"/>
  <circle cx="356" cy="256" r="42" fill="#5a9a6b"/>
  <circle cx="356" cy="256" r="16" fill="#eafaef"/>
</svg>
